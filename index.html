<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#101813">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>Calisthenics Coach</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="v03.css">
</head>
<body>
  <header class="topbar"><div><span class="eyebrow">CALISTHENICS COACH</span><h1>今日も、丁寧に強く。</h1></div><button id="voiceToggle" class="icon-btn" aria-pressed="true">🔊 音声ON</button></header>
  <main>
    <section id="homeView">
      <div class="hero"><div><span class="pill">12種目・動作ガイドつき</span><h2>フォームを見て、<br>コーチと動く。</h2><p>端末内の図解が動きの順番を案内します。通信なしでもフォームを確認できます。</p></div><div class="hero-mark">動<br><small>MOVE</small></div></div>
      <h3>ワークアウトを選ぶ</h3><div id="plans" class="plan-grid"></div>
      <div class="history-head"><h3>最近の記録</h3><button id="exportBtn" class="text-btn">JSONを書き出す</button></div><div id="history" class="history"></div>
    </section>
    <section id="workoutView" hidden>
      <button id="backBtn" class="back">← メニュー</button>
      <div class="session-head"><div><span id="planLabel" class="eyebrow"></span><h2 id="exerciseName"></h2></div><span id="progressText" class="progress-text"></span></div>
      <div class="progress"><span id="progressBar"></span></div>
      <div class="motion-guide" aria-label="動作ガイド"><div class="motion-top"><span class="eyebrow">OFFLINE MOTION GUIDE</span><span id="motionCount">1 / 2</span></div><div class="motion-stage"><div id="motionFigure" class="motion-figure" aria-hidden="true"></div><div><strong id="motionTitle"></strong><p id="motionDetail"></p></div></div><div id="motionDots" class="motion-dots"></div></div>
      <div class="source-row"><span>動作ガイドは端末内で表示</span><a id="sourceLink" target="_blank" rel="noopener noreferrer">参考動画をYouTubeで開く ↗</a></div>
      <div class="coach-card"><div><span class="eyebrow">COACH</span><div id="target" class="target"></div><small id="setStatus">セット 1 / 3</small></div><div><div id="timer" class="timer">準備OK</div><small id="wakeStatus" class="wake-status">画面スリープ防止：待機中</small></div></div>
      <div class="form-card"><h3>フォームのポイント</h3><ul id="cues"></ul><p id="alternative" class="alternative"></p></div>
      <div class="controls"><button id="prevBtn" class="secondary">前の種目</button><button id="startBtn" class="primary">ワークアウトを通しで開始</button><button id="nextBtn" class="secondary">次の種目</button></div>
    </section>
  </main>
  <footer><p>痛みやめまいを感じたら中止してください。本アプリは医療助言ではありません。</p><a href="sources.html">参考動画・利用について</a></footer>
  <script src="app.js"></script>
</body>
</html>
