<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#101813">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>Calisthenics Coach</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar"><div><span class="eyebrow">CALISTHENICS COACH</span><h1>今日も、丁寧に強く。</h1></div><button id="voiceToggle" class="icon-btn" aria-pressed="true">🔊 音声ON</button></header>
  <main>
    <section id="homeView">
      <div class="hero"><div><span class="pill">12種目・動画つき</span><h2>フォームを見て、<br>コーチと動く。</h2><p>動画はタップした種目だけ読み込みます。通信環境のある場所でご利用ください。</p></div><div class="hero-mark">動<br><small>MOVE</small></div></div>
      <h3>ワークアウトを選ぶ</h3><div id="plans" class="plan-grid"></div>
      <div class="history-head"><h3>最近の記録</h3><button id="exportBtn" class="text-btn">JSONを書き出す</button></div><div id="history" class="history"></div>
    </section>
    <section id="workoutView" hidden>
      <button id="backBtn" class="back">← メニュー</button>
      <div class="session-head"><div><span id="planLabel" class="eyebrow"></span><h2 id="exerciseName"></h2></div><span id="progressText" class="progress-text"></span></div>
      <div class="progress"><span id="progressBar"></span></div>
      <div class="video-shell"><div id="videoPlaceholder" class="video-placeholder"><div class="play">▶</div><strong>お手本動画を読み込む</strong><small>再生するとYouTubeに接続します</small></div><iframe id="videoFrame" title="お手本動画" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen hidden></iframe></div>
      <div class="source-row"><span id="sourceName"></span><a id="sourceLink" target="_blank" rel="noopener noreferrer">YouTubeで開く ↗</a></div>
      <div class="coach-card"><div><span class="eyebrow">COACH</span><div id="target" class="target"></div></div><div id="timer" class="timer">準備OK</div></div>
      <div class="form-card"><h3>フォームのポイント</h3><ul id="cues"></ul><p id="alternative" class="alternative"></p></div>
      <div class="controls"><button id="prevBtn" class="secondary">前の種目</button><button id="startBtn" class="primary">この種目を開始</button><button id="nextBtn" class="secondary">次の種目</button></div>
    </section>
  </main>
  <footer><p>痛みやめまいを感じたら中止してください。本アプリは医療助言ではありません。</p><a href="sources.html">動画出典・利用について</a></footer>
  <script src="app.js"></script>
</body>
</html>
